[project]
name = "referral-job-monitor"
version = "0.1.0"
description = "Local connector lab for official careers sources"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=0.72,<1",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
referrals-worker = "app.worker:main"
referrals-worker-once = "app.worker:once_main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["live: manual tests that access official careers sources"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
